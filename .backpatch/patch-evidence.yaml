  - cve: CVE-2026-114104
    upstream_fix_url: https://github.com/cthackers/adm-zip/commit/05101d47b3b983b705cc3e66fc34366118ba7b99
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-114104
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-adm-zip/commit/eb96373
    basis: backport
    artifacts:
      - adm-zip
    note: "New in this release; upstream's fix in 0.6.1. adm-zip now refuses an archive that holds two entries of the same name, with the error Duplicate entry name, when it reads the archive's entries. On this line adm-zip keeps its entry table in a plain object, so an archive entry at the root whose whole name is one of the keys of Object.prototype, such as constructor or toString, now also counts as a duplicate: reading such an archive throws Duplicate entry name where 0.5.18 read it. Applications that open archives with entries named that way can no longer read them with this release. The check is upstream's as written; upstream's own line keeps its entry table in an object without a prototype, which this line does not have."
